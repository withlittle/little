name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in debug builds: CI never reads it, and it filled the
  # runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the plugins: tests/plugin, which the tests build, plugins/pydoc,
          # plugins/rustdoc, and plugins/jsdoc.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tests/plugin/Cargo.toml
          cargo fmt --check --manifest-path plugins/api_reference/Cargo.toml
          cargo fmt --check --manifest-path plugins/pydoc/Cargo.toml
          cargo fmt --check --manifest-path plugins/rustdoc/Cargo.toml
          cargo fmt --check --manifest-path plugins/jsdoc/Cargo.toml

      # pydoc, rustdoc, and jsdoc are linted, tested, and built with --locked,
      # as their releases are, so a pull request that raises one's version
      # without its Cargo.lock fails here. Each command needs it, or cargo
      # would update Cargo.lock for those after it.
      - name: Lint (clippy, warnings are errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path tests/plugin/Cargo.toml --target wasm32-wasip2 --target-dir target/test-plugin -- -D warnings
          cargo clippy --manifest-path plugins/api_reference/Cargo.toml --all-targets --target-dir target/api_reference -- -D warnings
          cargo clippy --locked --manifest-path plugins/pydoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/pydoc -- -D warnings
          cargo clippy --locked --manifest-path plugins/rustdoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/rustdoc -- -D warnings
          cargo clippy --locked --manifest-path plugins/jsdoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/jsdoc -- -D warnings

      - name: Test
        run: |
          cargo test
          cargo test --manifest-path plugins/api_reference/Cargo.toml --target-dir target/api_reference
          cargo test --locked --manifest-path plugins/pydoc/Cargo.toml --target-dir target/pydoc
          cargo test --locked --manifest-path plugins/rustdoc/Cargo.toml --target-dir target/rustdoc
          cargo test --locked --manifest-path plugins/jsdoc/Cargo.toml --target-dir target/jsdoc

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # The notices little's and the plugins' releases carry
      # (docs/decisions/0054), so a pull request that changes a crate's
      # licence fails here, not a release. For little's, the script runs the
      # example `cargo test` built.
      - name: Write the third-party notices
        run: |
          scripts/notices.sh little target/notices/little.md
          scripts/notices.sh pydoc target/notices/pydoc.md
          scripts/notices.sh rustdoc target/notices/rustdoc.md
          scripts/notices.sh jsdoc target/notices/jsdoc.md

      # The crate a release publishes to crates.io, built as crates.io would
      # build it, so a pull request that leaves a file little needs out of
      # Cargo.toml's include fails here, not a release (docs/decisions/0055).
      - name: Package little-docs
        run: cargo package --locked

      - name: Build release
        run: |
          cargo build --release
          cargo build --release --locked --target wasm32-wasip2 --manifest-path plugins/pydoc/Cargo.toml --target-dir target/pydoc
          cargo build --release --locked --target wasm32-wasip2 --manifest-path plugins/rustdoc/Cargo.toml --target-dir target/rustdoc
          cargo build --release --locked --target wasm32-wasip2 --manifest-path plugins/jsdoc/Cargo.toml --target-dir target/jsdoc

  # The job above tests on Linux x64. This one tests on each other platform
  # little could be released for, on its own runner. Formatting, lints, and
  # the plugins' builds don't depend on the platform, so they run only above.
  test:
    name: test / ${{ matrix.name }}
    strategy:
      # Each platform's run finishes, whichever fails.
      fail-fast: false
      matrix:
        include:
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # For tests/plugin, which the tests build.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

  commits:
    name: commit messages
    # Only a pull request has commits of its own to check, against
    # committed.toml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # committed reads each of the pull request's commits.
          fetch-depth: 0

      - name: Check commit messages (Conventional Commits)
        uses: crate-ci/committed@v1.1.11
