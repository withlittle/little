name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in debug builds: CI never reads it, and it filled the
  # runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the plugins: tests/plugin, which the tests build, and plugins/docstrings.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tests/plugin/Cargo.toml
          cargo fmt --check --manifest-path plugins/docstrings/Cargo.toml

      - name: Lint (clippy, warnings are errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path tests/plugin/Cargo.toml --target wasm32-wasip2 --target-dir target/test-plugin -- -D warnings
          cargo clippy --manifest-path tests/plugin/Cargo.toml --target wasm32-wasip2 --target-dir target/test-plugin-pages --features pages -- -D warnings
          cargo clippy --manifest-path plugins/docstrings/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/docstrings -- -D warnings

      - name: Test
        run: |
          cargo test
          cargo test --manifest-path plugins/docstrings/Cargo.toml --target-dir target/docstrings

      - name: Build release
        run: |
          cargo build --release
          cargo build --release --target wasm32-wasip2 --manifest-path plugins/docstrings/Cargo.toml --target-dir target/docstrings
