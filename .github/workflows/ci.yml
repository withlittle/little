name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in debug builds: CI never reads it, and it filled the
  # runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the plugins: tests/plugin, which the tests build, plugins/pydoc,
          # plugins/rustdoc, and plugins/jsdoc.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tests/plugin/Cargo.toml
          cargo fmt --check --manifest-path plugins/api_reference/Cargo.toml
          cargo fmt --check --manifest-path plugins/pydoc/Cargo.toml
          cargo fmt --check --manifest-path plugins/rustdoc/Cargo.toml
          cargo fmt --check --manifest-path plugins/jsdoc/Cargo.toml

      - name: Lint (clippy, warnings are errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path tests/plugin/Cargo.toml --target wasm32-wasip2 --target-dir target/test-plugin -- -D warnings
          cargo clippy --manifest-path plugins/api_reference/Cargo.toml --all-targets --target-dir target/api_reference -- -D warnings
          cargo clippy --manifest-path plugins/pydoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/pydoc -- -D warnings
          cargo clippy --manifest-path plugins/rustdoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/rustdoc -- -D warnings
          cargo clippy --manifest-path plugins/jsdoc/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/jsdoc -- -D warnings

      - name: Test
        run: |
          cargo test
          cargo test --manifest-path plugins/api_reference/Cargo.toml --target-dir target/api_reference
          cargo test --manifest-path plugins/pydoc/Cargo.toml --target-dir target/pydoc
          cargo test --manifest-path plugins/rustdoc/Cargo.toml --target-dir target/rustdoc
          cargo test --manifest-path plugins/jsdoc/Cargo.toml --target-dir target/jsdoc

      - name: Build release
        run: |
          cargo build --release
          cargo build --release --target wasm32-wasip2 --manifest-path plugins/pydoc/Cargo.toml --target-dir target/pydoc
          cargo build --release --target wasm32-wasip2 --manifest-path plugins/rustdoc/Cargo.toml --target-dir target/rustdoc
          cargo build --release --target wasm32-wasip2 --manifest-path plugins/jsdoc/Cargo.toml --target-dir target/jsdoc

  commits:
    name: commit messages
    # Only a pull request has commits of its own to check, against
    # committed.toml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # committed reads each of the pull request's commits.
          fetch-depth: 0

      - name: Check commit messages (Conventional Commits)
        uses: crate-ci/committed@v1.1.11
