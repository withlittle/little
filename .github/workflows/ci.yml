name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in debug builds: CI never reads it, and it filled the
  # runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    env:
      # Each in plugins/, in its own workspace: the libraries the plugins
      # share, built natively, and the plugins, built for wasm32-wasip2.
      LIBRARIES: api_reference markup
      PLUGINS: pydoc rustdoc jsdoc godoc jupyter asciidoc orgmode restructuredtext
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the plugins: tests/plugin, which the tests build, and those
          # in PLUGINS.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tests/plugin/Cargo.toml
          for p in $LIBRARIES $PLUGINS; do
            cargo fmt --check --manifest-path plugins/$p/Cargo.toml
          done

      # The plugins are linted, tested, and built with --locked, as their
      # releases are, so a pull request that raises one's version without its
      # Cargo.lock fails here. Each command needs it, or cargo would update
      # Cargo.lock for those after it.
      - name: Lint (clippy, warnings are errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path tests/plugin/Cargo.toml --target wasm32-wasip2 --target-dir target/test-plugin -- -D warnings
          for p in $LIBRARIES; do
            cargo clippy --manifest-path plugins/$p/Cargo.toml --all-targets --target-dir target/$p -- -D warnings
          done
          for p in $PLUGINS; do
            cargo clippy --locked --manifest-path plugins/$p/Cargo.toml --all-targets --target wasm32-wasip2 --target-dir target/$p -- -D warnings
          done

      - name: Test
        run: |
          cargo test
          for p in $LIBRARIES; do
            cargo test --manifest-path plugins/$p/Cargo.toml --target-dir target/$p
          done
          for p in $PLUGINS; do
            cargo test --locked --manifest-path plugins/$p/Cargo.toml --target-dir target/$p
          done

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # The notices little's and the plugins' releases carry
      # (decisions/0054), so a pull request that changes a crate's
      # licence fails here, not a release. For little's, the script runs the
      # example `cargo test` built.
      - name: Write the third-party notices
        run: |
          for c in little $PLUGINS; do
            scripts/notices.sh $c target/notices/$c.md
          done

      # The crate a release publishes to crates.io, built as crates.io would
      # build it, so a pull request that leaves a file little needs out of
      # Cargo.toml's include fails here, not a release (decisions/0055).
      - name: Package little-docs
        run: cargo package --locked

      - name: Build release
        run: |
          cargo build --release
          for p in $PLUGINS; do
            cargo build --release --locked --target wasm32-wasip2 --manifest-path plugins/$p/Cargo.toml --target-dir target/$p
          done

  # The job above tests on Linux x64. This one tests on each other platform
  # little could be released for, on its own runner. Formatting, lints, and
  # the plugins' builds don't depend on the platform, so they run only above.
  test:
    name: test / ${{ matrix.name }}
    strategy:
      # Each platform's run finishes, whichever fails.
      fail-fast: false
      matrix:
        include:
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # For tests/plugin, which the tests build.
          targets: wasm32-wasip2

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

  commits:
    name: commit messages
    # Only a pull request has commits of its own to check, against
    # committed.toml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # committed reads each of the pull request's commits.
          fetch-depth: 0

      - name: Check commit messages (Conventional Commits)
        uses: crate-ci/committed@v1.1.11
