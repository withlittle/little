name: Release little

# A tag of little's version, like v0.1.0, releases little, as RELEASING.md
# and docs/decisions/0055 describe: its binary for Linux, macOS, and Windows,
# on x64 and arm64, each in an archive with its licence and third-party
# notices, on GitHub, then its crate, little-docs, on crates.io. A plugin's
# tag, like pydoc-v0.1.0, doesn't match. A pull request that changes this
# workflow or little's dependencies builds and packs the archives, but
# releases nothing, so what would break a release breaks there first.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

# A pull request's run is cancelled by a newer one; a release's never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request has no tag, so it checks nothing here, but runs this job
  # anyway, as a job that's skipped skips every job after it.
  check:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          # Every commit: the tag must be on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust toolchain
        if: github.event_name == 'push'
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag
        id: tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pattern='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
          if [[ ! $GITHUB_REF_NAME =~ $pattern ]]; then
            echo "::error::$GITHUB_REF_NAME isn't a version of little, like v0.1.0"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that isn't on main"
            exit 1
          fi
          # This finds a draft release too.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is released already, and a release is never changed"
            exit 1
          fi
          manifest_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "little-docs") | .version')
          if [[ $manifest_version != "$version" ]]; then
            echo "::error file=Cargo.toml::$GITHUB_REF_NAME is version $version, but Cargo.toml says ${manifest_version:-nothing}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.target }}
    needs: check
    strategy:
      # Each target's build finishes, whichever fails.
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Each of these is read only when building for its own target.
    env:
      # Linux's binaries are static, against musl, so they run on any
      # distribution. Their C code is compiled with musl-tools' compiler,
      # which cc would look for as aarch64-linux-musl-gcc on arm64.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      # jemalloc's pages are 64 KiB on arm64 Linux, so it runs on kernels with
      # 4, 16, or 64 KiB pages, like a Raspberry Pi 5's, or Asahi Linux's.
      AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE: 16
      # Ubuntu's GCC compiles atomics on arm64 to calls into libgcc, which
      # jemalloc's configure can't link against musl, so it finds none, as
      # https://github.com/jemalloc/jemalloc/issues/2782 says; this compiles
      # them inline.
      CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
      # Windows' binaries have the C runtime built in, so they need no Visual
      # C++ Redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # A site with a code block, so its C regex library runs too.
      - name: Check the binary runs
        run: |
          little=$PWD/target/$TARGET/release/little
          site=$RUNNER_TEMP/site
          mkdir -p "$site/docs"
          printf '# little\n\n```rust\nfn main() {}\n```\n' > "$site/docs/README.md"
          "$little" --version
          "$little" -C "$site" build --strict
          grep -q '<pre class="highlight"' "$site/dist/index.html"

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: little-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/little
            target/${{ matrix.target }}/release/little.exe
          if-no-files-found: error

  # The same for every target, as about.toml lists them all.
  notices:
    name: third-party notices
    needs: check
    runs-on: ubuntu-latest
    env:
      # No debug info in the debug build of the example scripts/notices.sh
      # runs, which nothing reads.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Write the third-party notices
        run: scripts/notices.sh little "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.md"

      - name: Upload the notices
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: ${{ runner.temp }}/notices/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  pack:
    name: pack the archives
    needs: [build, notices]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: little-*
          path: ${{ runner.temp }}/binaries

      - name: Download the notices
        uses: actions/download-artifact@v8
        with:
          name: notices
          path: ${{ runner.temp }}/notices

      # Each archive has its files at its root, and no version in its name,
      # so releases/latest/download/ finds it.
      - name: Pack each binary with its licence and notices
        run: |
          archives=$RUNNER_TEMP/archives
          mkdir "$archives"
          for dir in "$RUNNER_TEMP"/binaries/little-*; do
            target=${dir##*/little-}
            cp LICENSE "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.md" "$dir"
            if [[ $target == *-windows-* ]]; then
              (cd "$dir" && zip -X -q "$archives/little-$target.zip" little.exe LICENSE THIRD-PARTY-NOTICES.md)
            else
              # An artifact doesn't keep a file's mode.
              chmod +x "$dir/little"
              tar -czf "$archives/little-$target.tar.gz" --owner=0 --group=0 --numeric-owner \
                -C "$dir" little LICENSE THIRD-PARTY-NOTICES.md
            fi
          done
          cd "$archives"
          sha256sum little-* > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: ${{ runner.temp }}/archives/
          if-no-files-found: error

  release:
    name: publish the release
    needs: [check, pack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # To publish the release.
      contents: write
      # To attest where the archives were built.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Every commit and tag: the notes list the changes since little's
          # last tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          name: archives
          path: ${{ runner.temp }}/archives

      - name: Attest the archives' provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/archives/little-*

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Write the release notes
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY"
          # little's tag before this one, if it has one. Its changes are those
          # to what's built into little, not to its manual or plugins.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [[ -n $previous ]]; then
            changes=$(git cliff --tag-pattern '^v[0-9]' \
              --include-path 'src/**' \
              --include-path 'theme/**' \
              --include-path 'wit/**' \
              --include-path Cargo.toml \
              --include-path Cargo.lock \
              "$previous..HEAD")
          fi
          {
            echo "little's binaries for Linux, macOS, and Windows, on x64 and arm64, are below, each in an archive with its licence and third-party notices. To install one, unpack the archive for your system, and put \`little\` on your \`PATH\`, or let cargo-binstall do it:"
            echo
            echo '```sh'
            echo "cargo binstall little-docs"
            echo '```'
            echo
            echo "[The manual's install page]($repo/blob/$GITHUB_REF_NAME/docs/getting-started/install.md) says which archive is for your system, how to check it, and how to build little with Cargo instead."
            echo
            if [[ -z $previous ]]; then
              echo "This is little's first release."
            else
              echo "## Changes since $previous"
              echo
              echo "${changes:-No features, fixes, or breaking changes.}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # little's newest release is the repository's "Latest". gh publishes
        # the release once its files are uploaded, and deletes it if that
        # fails.
        run: >-
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/archives/*
          --verify-tag --latest
          --title "little $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"

  # After the release, as cargo binstall downloads its archives. crates.io
  # never takes a version back, so a release that fails stops before this.
  crates-io:
    name: publish to crates.io
    needs: [check, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # crates.io trusts this workflow, in this environment, which only a v*
    # tag can use, to publish little-docs, as RELEASING.md says.
    environment: crates-io
    permissions:
      contents: read
      # For a token from crates.io's trusted publishing.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # So the job can be run again.
      - name: Check whether crates.io has this version
        id: crate
        run: |
          # crates.io asks for a user agent that says who's asking.
          agent="little's release workflow (https://github.com/$GITHUB_REPOSITORY)"
          url=https://crates.io/api/v1/crates/little-docs/$VERSION
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" "$url")
          if [[ $status == 200 ]]; then
            echo "::notice::little-docs $VERSION is on crates.io already"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ $status == 404 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io answered $status for $url"
            exit 1
          fi

      - name: Install stable Rust toolchain
        if: steps.crate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Get a token from crates.io
        id: auth
        if: steps.crate.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish little-docs
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
