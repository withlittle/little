# Site config — the LAST word in the cascade (little -> theme -> site).
# Optional: without this file, the theme's config and little's defaults apply.
site:
  name: little
  description: The little static documentation site generator for big things.
  url: https://withlittle.github.io/little
  # Where the site's source is, so each page can link to its file there.
  repository:
    url: https://github.com/withlittle/little

  # The built-in theme is compiled from ./theme; building with the folder
  # instead means editing it live-reloads. Without this, little uses its
  # built-in copy.
  theme:
    source: ./theme

  # The plugins that read the pages in other formats, each written in the
  # format it describes: jupyter, for docs/plugins/jupyter.ipynb,
  # asciidoc, for asciidoc.adoc, orgmode, for org-mode.org, and
  # restructuredtext, for restructuredtext.rst. Then sitemap, which writes
  # the manual's sitemap.xml. Build each before the manual, with:
  #   cargo build --release --target wasm32-wasip2 --manifest-path plugins/jupyter/Cargo.toml
  # and the same for plugins/asciidoc, plugins/orgmode,
  # plugins/restructuredtext, and plugins/sitemap.
  plugins:
    jupyter:
      wasm: ./plugins/jupyter/target/wasm32-wasip2/release/little_jupyter.wasm
    asciidoc:
      wasm: ./plugins/asciidoc/target/wasm32-wasip2/release/little_asciidoc.wasm
    orgmode:
      wasm: ./plugins/orgmode/target/wasm32-wasip2/release/little_orgmode.wasm
    restructuredtext:
      wasm: ./plugins/restructuredtext/target/wasm32-wasip2/release/little_restructuredtext.wasm
    sitemap:
      wasm: ./plugins/sitemap/target/wasm32-wasip2/release/little_sitemap.wasm

  # The manual's pages in the order to read them, rather than by title. A
  # page that isn't listed isn't in the nav, so list each new one.
  navigation:
    items:
      - { title: Home, url: / }
      - title: Getting started
        children:
          - { title: Install, url: /getting-started/install }
          - { title: Your first site, url: /getting-started/first-site }
          - { title: Configuring, url: /getting-started/configuring }
          - { title: Publishing, url: /getting-started/publishing }
      - title: Writing
        children:
          - { title: Pages and files, url: /writing/pages-and-files }
          - { title: Markdown, url: /writing/markdown }
          - { title: Links and images, url: /writing/links-and-images }
          - { title: Code, url: /writing/code }
          - { title: Math, url: /writing/math }
          - { title: Diagrams, url: /writing/diagrams }
          - { title: Frontmatter, url: /writing/frontmatter }
          - { title: Navigation, url: /writing/navigation }
          - { title: Search, url: /writing/search }
          - { title: Versions, url: /writing/versions }
      - title: Themes
        children:
          - { title: Choosing a theme, url: /themes/choosing-a-theme }
          - { title: Making a theme, url: /themes/making-a-theme }
          - { title: Sass, url: /themes/sass }
          - { title: Styling Markdown, url: /themes/styling-markdown }
      - title: Plugins
        children:
          - { title: Using plugins, url: /plugins/using-plugins }
          - { title: Writing plugins, url: /plugins/writing-plugins }
          - { title: Sitemap, url: /plugins/sitemap }
          - { title: Jupyter notebooks, url: /plugins/jupyter }
          - { title: AsciiDoc, url: /plugins/asciidoc }
          - { title: Org mode, url: /plugins/org-mode }
          - { title: reStructuredText, url: /plugins/restructuredtext }
          - { title: OpenAPI, url: /plugins/openapi }
          - { title: Python docs, url: /plugins/pydoc }
          - { title: Rust docs, url: /plugins/rustdoc }
          - { title: Go docs, url: /plugins/godoc }
          - { title: JavaScript docs, url: /plugins/jsdoc }
      - title: Reference
        children:
          - { title: Commands, url: /reference/commands }
          - { title: Settings, url: /reference/settings }
          - { title: Template data, url: /reference/template-data }
          - { title: Plugin hooks, url: /reference/plugin-hooks }
