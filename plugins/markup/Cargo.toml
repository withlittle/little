[package]
name = "little-markup"
version = "0.1.0"
edition = "2024"
description = "A document, as little's plugins for other formats read it, written as the Markdown a site's settings allow"
license = "MIT"
publish = false

# Its own workspace, apart from little's and the plugins'.
[workspace]

[dependencies]
serde_json = "1.0.151"
finl_unicode = { version = "1.5", default-features = false, features = ["categories"] }

[dev-dependencies]
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }
