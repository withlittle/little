[package]
name = "little-jupyter"
version = "0.1.0"
edition = "2024"
description = "A plugin for little that builds a page from each Jupyter notebook"
license = "MIT"
publish = false

# A WebAssembly component, built for wasm32-wasip2.
[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Its own workspace, apart from little's.
[workspace]
