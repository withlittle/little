# How cargo-about writes rustdoc's third-party notices, which its releases
# include: see docs/decisions/0054-third-party-notices.md.

# The licences rustdoc's crates may use, in order of preference: where a crate
# offers a choice, the first listed wins.
accepted = ["MIT", "Unicode-3.0", "Zlib"]
targets = ["wasm32-wasip2"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Leaves out rustdoc and little-api-reference, which aren't published.
private = { ignore = true }
