[package]
name = "little-restructuredtext"
version = "0.1.0"
edition = "2024"
description = "A plugin for little that builds a page from each reStructuredText file"
license = "MIT"
publish = false

# A WebAssembly component, built for wasm32-wasip2.
[lib]
crate-type = ["cdylib"]

[dependencies]
little-markup = { path = "../markup" }
unicode-width = { version = "0.2", default-features = false }
wit-bindgen = "0.62"

[dev-dependencies]
little-markup = { path = "../markup", features = ["testing"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Its own workspace, apart from little's.
[workspace]
