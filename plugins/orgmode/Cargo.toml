[package]
name = "little-orgmode"
version = "0.1.0"
edition = "2024"
description = "A plugin for little that builds a page from each Org mode file"
license = "MIT"
publish = false

# A WebAssembly component, built for wasm32-wasip2.
[lib]
crate-type = ["cdylib"]

[dependencies]
little-markup = { path = "../markup" }
orgize = "=0.10.0-alpha.10"
wit-bindgen = "0.62"

[dev-dependencies]
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }
little-markup = { path = "../markup", features = ["testing"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Its own workspace, apart from little's.
[workspace]
