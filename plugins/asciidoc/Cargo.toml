[package]
name = "little-asciidoc"
version = "0.1.0"
edition = "2024"
description = "A plugin for little that builds a page from each AsciiDoc file"
license = "MIT"
publish = false

# A WebAssembly component, built for wasm32-wasip2.
[lib]
crate-type = ["cdylib"]

[dependencies]
asciidoc-parser = "0.31.2"
little-markup = { path = "../markup" }
serde_json = "1.0.151"
wit-bindgen = "0.62"

[dev-dependencies]
comrak = { version = "0.55", default-features = false, features = ["shortcodes"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Its own workspace, apart from little's.
[workspace]
