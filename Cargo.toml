[package]
name = "little"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
codemap = "0.1.3"
comrak = "0.55.0"
flate2 = "1.1.10"
futures = "0.3.34"
grass = { version = "0.13.4", default-features = false, features = ["random"] }
lychee-lib = { version = "0.24.2", default-features = false }
math-core = "0.8.2"
minijinja = { version = "2.24.0", features = ["loader"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
pagefind = { version = "1.5.2", default-features = false }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tar = { version = "0.4.46", default-features = false }
time = "0.3.55"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
two-face = "0.5.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
