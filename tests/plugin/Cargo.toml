[package]
name = "little-test-plugin"
version = "0.0.0"
edition = "2024"
publish = false

# Built by little's tests, for wasm32-wasip2, with `plugin::tests::test_plugin`.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Keeps the order of an object's keys, as little gives them.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
wit-bindgen = "0.62"

# Its own workspace, apart from little's.
[workspace]
