[package]
name = "little-test-plugin"
version = "0.0.0"
edition = "2024"
publish = false

# Built by little's tests, for wasm32-wasip2, with `plugin::tests::test_plugin`.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.151"
wit-bindgen = "0.62"

[features]
# Exports `plugin-with-pages`, adding the pages its settings list, rather than
# `plugin`.
pages = []

# Its own workspace, apart from little's.
[workspace]
